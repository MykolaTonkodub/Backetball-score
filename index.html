<html>
	<head>
		<link rel="stylesheet" href="index.css" />
		<link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet" />
	</head>
	<body>
		<div class="container">
			<div>
				<h3>HOME</h3>
				<p id="home-score">0</p>
				<div class="bonus-point-selection">
					<button class="bonus-point" id="home-bonus-point1">+1</button>
					<button class="bonus-point" id="home-bonus-point2">+2</button>
					<button class="bonus-point" id="home-bonus-point3">+3</button>
				</div>
			</div>
			<div class="divider"></div>
			<div>
				<h3>GUEST</h3>
				<p id="guest-score">0</p>
				<div class="bonus-point-selection">
					<button class="bonus-point" id="guest-bonus-point1">+1</button>
					<button class="bonus-point" id="guest-bonus-point2">+2</button>
					<button class="bonus-point" id="guest-bonus-point3">+3</button>
				</div>
			</div>
		</div>
		<script src="index.js"></script>
	</body>
</html>
